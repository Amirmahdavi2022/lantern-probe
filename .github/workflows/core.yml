name: build lantern core

# Builds Lantern's flashlight engine as a STANDALONE SOCKS5 binary, not a gomobile AAR.
#
# Why not the AAR, which already builds and already works on the phone:
# Panther's Global engine ships Psiphon's ca.psiphon.aar, and that is a gomobile
# build. So is lanternsdk-android. Both carry jni/<abi>/libgojni.so and both carry
# go/Seq*.class - same names, different code. An APK can hold only one of each, so
# the native merge step fails, and forcing it through with pickFirst would wire one
# engine to the other's native code. Measured on the two real files, not assumed:
#   ca.psiphon.aar        jni/arm64-v8a/libgojni.so   31131824 bytes
#   lanternsdk-android.aar jni/arm64-v8a/libgojni.so  40528592 bytes
# This is the same wall that killed the Xray AAR route back in September, and the
# answer is the same one that worked then: ship the core as its own executable.
# Panther already runs three of those (libaether.so, libxray.so, libbyedpi.so).
#
# The other reason this shape is better: flashlight's client has a real SOCKS5
# server (client.ListenAndServeSOCKS5, reachable through Flashlight.Run's second
# argument), which the SDK never exposes - it only publishes the HTTP proxy. SOCKS
# is what Panther's hev bridge already speaks, so the engine needs no Xray hop in
# between. It plugs in exactly where libaether.so does.
#
# Two traps this build is written around, both read out of flashlight v7.6.241:
#  1. reverseDNS must NOT be nil. flashlight only installs a default when enableVPN
#     is true, and the SOCKS handler calls client.reverseDNS on every connection -
#     so a nil there is a panic on the first request, which would read exactly like
#     "Lantern does not work". A pass-through is installed instead.
#  2. enableVPN must stay false: it starts dnsgrab on 127.0.0.1:53, which an
#     unprivileged Android process cannot bind, and the tunnel answers DNS anyway.
#
# The run does not stop at "it compiled". It starts the host build and pushes real
# traffic through its SOCKS port - by hostname and by IP literal, because the bridge
# sends IPs - and fails if nothing comes back.
#
# 🚨 CGO is not optional here, which run 1 found the hard way. Two of flashlight's
# dependencies have no pure-Go path at all:
#   go-llsqlite/crawshaw           its SQLITE_* constants come from cgo, so with CGO
#                                  off the file defining them is dropped and they read
#                                  as undefined
#   outline-sdk/x/smart            cname_unix.go is //go:build unix AND imports "C";
#                                  on Linux the !unix alternative is excluded too, so
#                                  lookupCNAME ends up with no definition at all
# So the Android builds go through the NDK's clang instead of Go's own toolchain. That
# is what gomobile was doing for the AAR all along; the difference here is only that
# the output is an executable rather than a library with a Go runtime bolted in.

on:
  workflow_dispatch:
    inputs:
      flashlight_version:
        description: 'flashlight version to pin'
        required: false
        default: 'v7.6.241'
  push:
    branches: [ main ]
    paths: [ '.github/workflows/core.yml' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          path: host

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false

      - name: Write the core
        run: |
          set -e
          mkdir -p core
          cat > core/main.go <<'GOFILE'
          // Command lanterncore runs Lantern's flashlight engine as a local SOCKS5
          // proxy and nothing else. It is a plain executable so that it can live in
          // an app's native library directory beside other cores without sharing a
          // Go runtime with any of them.
          package main

          import (
          	"flag"
          	"fmt"
          	"os"
          	"os/signal"
          	"syscall"
          	"time"

          	"github.com/getlantern/flashlight/v7"
          	"github.com/getlantern/flashlight/v7/client"
          	"github.com/getlantern/flashlight/v7/common"
          	"github.com/getlantern/flashlight/v7/stats"
          )

          // Free-tier credentials, the same ones the official Android SDK ships. They
          // are what authenticates to Lantern's API; without them no config is fetched.
          const (
          	deviceID = "a34113"
          	userID   = int64(381696446)
          	token    = "K1qttSsZruN"
          )

          func main() {
          	socksAddr := flag.String("socks", "127.0.0.1:1821", "address for the local SOCKS5 listener")
          	httpAddr := flag.String("http", "127.0.0.1:0", "address for the local HTTP listener")
          	configDir := flag.String("configdir", "", "directory the engine keeps its fetched config in")
          	appName := flag.String("appname", "lantern", "application name reported upstream")
          	appVersion := flag.String("appversion", "7.6.241", "application version reported upstream")
          	proxyAll := flag.Bool("proxyall", true, "send every connection through Lantern rather than shortcutting")
          	flag.Parse()

          	if *configDir == "" {
          		fmt.Fprintln(os.Stderr, "configdir is required")
          		os.Exit(2)
          	}
          	if err := os.MkdirAll(*configDir, 0o700); err != nil {
          		fmt.Fprintf(os.Stderr, "cannot use configdir %v: %v\n", *configDir, err)
          		os.Exit(2)
          	}

          	userConfig := common.NewUserConfigData(*appName, deviceID, userID, token, map[string]string{}, "")

          	// The SOCKS5 handler calls this for every connection. flashlight only
          	// supplies one of its own when VPN mode is on, and VPN mode is not usable
          	// here, so a nil would be a panic on the first connection rather than a
          	// missing feature. Addresses are passed through untouched: the tunnel in
          	// front of this already decided where the traffic is going.
          	reverseDNS := func(addr string) (string, error) { return addr, nil }

          	runner, err := flashlight.New(
          		*appName,
          		*appVersion,
          		time.Now().Format("2006-01-02"),
          		*configDir,
          		false,                        // enableVPN - dnsgrab would try to bind 127.0.0.1:53
          		func() bool { return false }, // disconnected
          		func() bool { return *proxyAll },
          		func() bool { return false }, // allowPrivateHosts
          		func() bool { return true },  // autoReport
          		map[string]interface{}{},
          		userConfig,
          		stats.NewTracker(),
          		func() bool { return false }, // isPro
          		func() string { return "" },  // lang, desktop only
          		reverseDNS,
          		func(category, action, label string) {},
          	)
          	if err != nil {
          		fmt.Fprintf(os.Stderr, "the engine did not start: %v\n", err)
          		os.Exit(1)
          	}

          	fmt.Printf("lantern core starting, config dir %v\n", *configDir)

          	go runner.Run(*httpAddr, *socksAddr, nil, func(err error) {
          		fmt.Fprintf(os.Stderr, "lantern error: %v\n", err)
          	})

          	// Report readiness on the SOCKS address rather than on Run returning:
          	// Run blocks on the HTTP listener and the SOCKS listener comes up beside
          	// it, so the only honest readiness signal is the SOCKS address appearing.
          	go func() {
          		if addr, ok := client.Socks5Addr(2 * time.Minute); ok {
          			fmt.Printf("lantern core ready: SOCKS5 listening on %v\n", addr)
          		} else {
          			fmt.Fprintln(os.Stderr, "lantern core: no SOCKS5 address after two minutes")
          		}
          	}()

          	sig := make(chan os.Signal, 1)
          	signal.Notify(sig, syscall.SIGINT, syscall.SIGTERM)
          	<-sig
          }
          GOFILE

          # A replace directive in a dependency's go.mod is ignored; only the main
          # module's own count. flashlight carries three, so they are repeated here or
          # the build resolves packages its source was never written against.
          cat > core/go.mod <<'MODFILE'
          module lanterncore

          go 1.24.2

          replace github.com/keighl/mandrill => github.com/getlantern/mandrill v0.0.0-20221004112352-e7c04248adcb

          replace github.com/eycorsican/go-tun2socks => github.com/getlantern/go-tun2socks v1.16.12-0.20201218023150-b68f09e5ae93

          replace github.com/tetratelabs/wazero => github.com/refraction-networking/wazero v1.7.1-w

          require github.com/getlantern/flashlight/v7 v7.6.241
          MODFILE

          # The heredocs are indented so the YAML stays readable; strip it back off.
          sed -i 's/^          //' core/main.go core/go.mod
          echo "=== main.go ==="; head -12 core/main.go
          echo "=== go.mod ==="; cat core/go.mod

      - name: Resolve dependencies
        id: deps
        continue-on-error: true
        env:
          GOFLAGS: -mod=mod
        run: |
          set -o pipefail
          VER="${{ github.event.inputs.flashlight_version }}"
          [ -n "$VER" ] || VER=v7.6.241
          cd core
          {
            echo "=== pinning flashlight $VER ==="
            go get "github.com/getlantern/flashlight/v7@$VER"
            echo "=== go mod tidy ==="
            go mod tidy
            echo "=== resolved ==="
            grep -E 'flashlight' go.mod
          } 2>&1 | tee ../deps.log

      - name: Build for this runner and prove it carries traffic
        id: smoke
        if: steps.deps.outcome == 'success'
        continue-on-error: true
        env:
          GOFLAGS: -mod=mod
        run: |
          set -o pipefail
          cd core
          {
            echo "=== host build ==="
            CGO_ENABLED=1 go build -o ../lanterncore-host -trimpath -buildvcs=false \
              -ldflags="-s -w -buildid=" .
            ls -la ../lanterncore-host

            echo
            echo "=== starting it ==="
            mkdir -p "$GITHUB_WORKSPACE/lconf"
            ../lanterncore-host -socks 127.0.0.1:1821 -http 127.0.0.1:18080 \
              -configdir "$GITHUB_WORKSPACE/lconf" > ../core-run.log 2>&1 &
            CORE_PID=$!
            echo "pid $CORE_PID"

            ready=""
            for i in $(seq 1 60); do
              sleep 5
              if grep -q "SOCKS5 listening on" ../core-run.log; then
                ready="yes"
                echo "ready after $((i*5))s: $(grep 'SOCKS5 listening on' ../core-run.log | head -1)"
                break
              fi
              if ! kill -0 "$CORE_PID" 2>/dev/null; then
                echo "the core exited after $((i*5))s"
                break
              fi
            done
            [ -n "$ready" ] || { echo "never reported a SOCKS5 address"; tail -50 ../core-run.log; kill $CORE_PID 2>/dev/null; exit 1; }

            echo
            echo "=== config dir after start ==="
            ls -la "$GITHUB_WORKSPACE/lconf" || true

            # The engine needs a moment past binding the socket to have proxies to
            # dial through, so each request is retried rather than judged once.
            try() {
              label="$1"; shift
              for i in $(seq 1 12); do
                out="$(curl -s -m 20 "$@" 2>&1)" && [ -n "$out" ] && {
                  echo "$label OK after $((i*10))s"
                  echo "$out" | head -8
                  return 0
                }
                sleep 10
              done
              echo "$label FAILED"
              return 1
            }

            echo
            echo "=== traffic by hostname (remote DNS) ==="
            byname=no
            try "hostname" --socks5-hostname 127.0.0.1:1821 https://www.cloudflare.com/cdn-cgi/trace && byname=yes

            echo
            echo "=== traffic by IP literal - this is the shape the tunnel sends ==="
            byip=no
            try "ip" --socks5 127.0.0.1:1821 https://1.1.1.1/cdn-cgi/trace && byip=yes

            echo
            echo "=== config dir after traffic ==="
            ls -la "$GITHUB_WORKSPACE/lconf" || true

            kill $CORE_PID 2>/dev/null || true
            echo "byname=$byname byip=$byip"
            [ "$byname" = yes ] || [ "$byip" = yes ]
          } 2>&1 | tee ../smoke.log

      - name: Cross-build the three Android ABIs
        id: cross
        if: steps.deps.outcome == 'success'
        continue-on-error: true
        env:
          GOFLAGS: -mod=mod
          ANDROID_NDK_LATEST_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: |
          set -o pipefail
          cd core
          {
            mkdir -p "$GITHUB_WORKSPACE/out"

            ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
            toolchain="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
            [ -d "$toolchain" ] || { echo "no NDK toolchain under $ndk"; exit 1; }
            echo "toolchain: $toolchain"

            abis="arm64-v8a armeabi-v7a x86_64"
            arches="arm64 arm amd64"
            elfs="b700 2800 3e00"
            # API 24 rather than the app's minSdk 26: a lower floor costs nothing and
            # matches how the shaping proxy is already built in the app's own script.
            triples="aarch64-linux-android24 armv7a-linux-androideabi24 x86_64-linux-android24"
            i=1
            for abi in $abis; do
              arch="$(echo $arches | cut -d' ' -f$i)"
              want="$(echo $elfs | cut -d' ' -f$i)"
              triple="$(echo $triples | cut -d' ' -f$i)"
              out="$GITHUB_WORKSPACE/out/liblantern-$abi.so"
              [ -x "$toolchain/${triple}-clang" ] || { echo "no compiler ${triple}-clang"; exit 1; }
              # buildmode=pie is already the default for GOOS=android and is named here
              # because Android refuses to execute a non-PIE binary and a silent default
              # is a poor thing to depend on.
              # -checklinkname=0 is required and is not a workaround for our own code:
              # github.com/wlynxg/anet, which flashlight pulls in ONLY on android, reaches into
              # the standard library with //go:linkname to read net.zoneCache - that is how it
              # gets around Android blocking the netlink calls Go's own resolver uses. Go 1.23
              # started rejecting linknames to unexported std symbols, so without this flag the
              # link step fails with "invalid reference to net.zoneCache". It is also why the
              # host build passed while this one did not: anet is not in a linux build at all.
              # 🚨 -static-libstdc++ is what makes this runnable on a phone at all. Without it the
              # binary comes out NEEDING libc++_shared.so, which is an NDK library and is NOT on
              # an Android device - the process would die at exec with "CANNOT LINK EXECUTABLE",
              # before a single line of its own code ran. Upstream's own SDK wrapper carries the
              # same flag in its cgo directive. The alternative, shipping libc++_shared.so beside
              # it, is one more file to keep in step for no gain.
              CGO_ENABLED=1 GOOS=android GOARCH="$arch" GOARM=7 \
                CC="$toolchain/${triple}-clang" \
                CXX="$toolchain/${triple}-clang++" \
                CGO_LDFLAGS="-static-libstdc++" \
                go build -o "$out" -trimpath -buildvcs=false -buildmode=pie \
                -ldflags="-s -w -buildid= -checklinkname=0" . \
                || { echo "could not build $abi"; exit 1; }

              # Checked rather than trusted: every NEEDED entry has to be a library the platform
              # actually provides. This is the check that would have caught the problem above on
              # a runner instead of on a phone.
              needed="$(readelf -d "$out" | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p')"
              echo "$abi needs: $(echo $needed)"
              for lib in $needed; do
                case "$lib" in
                  libc.so|libm.so|libdl.so|liblog.so) ;;
                  *) echo "$abi links $lib, which Android does not ship"; exit 1 ;;
                esac
              done
              # Read the ELF machine field, so a binary built for the wrong phone is
              # caught here instead of on someone's device.
              got="$(od -An -tx1 -j18 -N2 "$out" | tr -d ' \n')"
              [ "$got" = "$want" ] || { echo "$abi has ELF machine $got, expected $want"; exit 1; }
              echo "$abi: built for $built, $(stat -c%s "$out") bytes, ELF machine $got"
              i=$((i+1))
            done
            cd "$GITHUB_WORKSPACE/out"
            sha256sum *.so | tee SHA256SUMS
          } 2>&1 | tee ../cross.log

      - name: Collect result
        id: collect
        run: |
          if [ -f out/liblantern-arm64-v8a.so ] && [ -f out/liblantern-armeabi-v7a.so ] && [ -f out/liblantern-x86_64.so ]; then
            echo "ok=yes" >> "$GITHUB_OUTPUT"
            ls -la out
          else
            echo "ok=no" >> "$GITHUB_OUTPUT"
            echo "no binaries produced"
          fi
          echo "smoke=${{ steps.smoke.outcome }}" >> "$GITHUB_OUTPUT"

      - name: Publish the binaries
        if: steps.collect.outputs.ok == 'yes'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          {
            gh release delete core-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || echo "delete skipped"
            gh release create core-latest \
              out/liblantern-arm64-v8a.so \
              out/liblantern-armeabi-v7a.so \
              out/liblantern-x86_64.so \
              out/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --title "lantern core (standalone SOCKS5)" \
              --notes "flashlight built as a plain executable with a SOCKS5 listener. Smoke test on the runner: ${{ steps.smoke.outcome }}."
          } 2>&1 | tee publish.log

      - name: Push the log where it can be read
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p logs
          L="logs/core-${GITHUB_RUN_NUMBER}.log"
          : > "$L"
          echo "########## DEPS ##########" >> "$L"
          tail -c 20000 deps.log >> "$L" 2>/dev/null || echo "no deps log" >> "$L"
          echo >> "$L"
          echo "########## SMOKE ##########" >> "$L"
          tail -c 60000 smoke.log >> "$L" 2>/dev/null || echo "no smoke log" >> "$L"
          echo >> "$L"
          echo "########## CORE OUTPUT ##########" >> "$L"
          tail -c 40000 core-run.log >> "$L" 2>/dev/null || echo "no core log" >> "$L"
          echo >> "$L"
          echo "########## CROSS ##########" >> "$L"
          tail -c 20000 cross.log >> "$L" 2>/dev/null || echo "no cross log" >> "$L"
          echo >> "$L"
          echo "########## PUBLISH ##########" >> "$L"
          tail -c 20000 publish.log >> "$L" 2>/dev/null || echo "no publish log" >> "$L"
          cd host
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git fetch origin ci-logs:ci-logs 2>/dev/null && git checkout ci-logs || git checkout --orphan ci-logs
          git rm -rq --cached . 2>/dev/null || true
          rm -rf .github README.md 2>/dev/null || true
          cp ../logs/*.log .
          git add -A
          git commit -q -m "core run ${GITHUB_RUN_NUMBER}: built=${{ steps.collect.outputs.ok }} smoke=${{ steps.smoke.outcome }}" || exit 0
          git push -q origin ci-logs

      - name: Fail if nothing was built
        if: steps.collect.outputs.ok != 'yes'
        run: exit 1
